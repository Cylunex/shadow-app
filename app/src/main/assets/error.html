<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连接失败</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,"Noto Sans SC",sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #e2e8f0; }
    main { width: min(86vw,420px); text-align: center; }
    .mark { margin: auto; width: 64px; height: 64px; display: grid; place-items: center;
      border-radius: 20px; background: #172033; color: #f59e0b; font-size: 30px; }
    h1 { font-size: 24px; margin: 20px 0 8px; }
    p { color: #94a3b8; line-height: 1.6; overflow-wrap: anywhere; }
    button { width: 100%; margin-top: 10px; padding: 13px; border-radius: 12px; border: 0;
      background: #0284c7; color: white; font-weight: 700; }
    .minor { background: transparent; border: 1px solid #334155; color: #cbd5e1; }
  </style>
</head>
<body><main>
  <div class="mark">!</div>
  <h1>暂时无法连接</h1>
  <p id="message">请检查服务器地址和网络连接。</p>
  <button onclick="ShellBridge.retry()">重试</button>
  <button class="minor" onclick="ShellBridge.openHome()">返回应用中心</button>
  <button class="minor" onclick="ShellBridge.openSettings()">连接设置</button>
</main>
<script>
  try {
    const detail = JSON.parse(ShellBridge.getError());
    if (detail.message) document.getElementById('message').textContent = detail.message;
  } catch (_) {}
</script>
</body></html>
