<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Shadow 应用</title>
  <style>
    :root {
      color-scheme:dark;
      font-family:system-ui,-apple-system,"Noto Sans SC","Microsoft YaHei",sans-serif;
      --bg:#0d1117;--surface:#111d28;--text:#edf6f8;
      --muted:#8296a3;--line:rgba(166,241,255,.11);--cyan:#a6f1ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{background:
      radial-gradient(circle at 96% -8%,rgba(24,184,200,.13),transparent 32%),
      linear-gradient(180deg,#0b1118 0%,#0d1117 48%,#0a1016 100%)}
    main{max-width:760px;margin:0 auto;padding:20px 16px 30px}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .identity{display:flex;align-items:center;gap:11px;min-width:0}
    .identity img{width:42px;height:42px;border-radius:14px;box-shadow:0 8px 28px rgba(24,184,200,.18)}
    .eyebrow{font-size:10px;letter-spacing:.18em;color:#6f8592;text-transform:uppercase}
    .title{margin-top:2px;font-size:19px;font-weight:700;letter-spacing:.02em}
    .status{display:flex;align-items:center;gap:7px;flex:none;padding:7px 10px;border:1px solid var(--line);
      border-radius:999px;background:rgba(17,29,40,.72);font-size:11px;color:#91a4af}
    .dot{width:7px;height:7px;border-radius:50%;background:#22c7cf;box-shadow:0 0 12px rgba(34,199,207,.85)}
    .intro{margin:28px 2px 15px}
    .intro h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:-.02em}
    .intro p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}
    .section-head h2{margin:0;font-size:14px;font-weight:650;letter-spacing:.04em}
    .section-head span{font-size:11px;color:#687d89}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .card{--accent:#18b8c8;position:relative;appearance:none;width:100%;min-height:158px;padding:14px;
      overflow:hidden;text-align:left;color:inherit;border:1px solid var(--line);border-radius:19px;
      background:linear-gradient(150deg,rgba(21,37,50,.96),rgba(14,24,33,.96));
      box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .14s,border-color .14s}
    .card::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;
      background:linear-gradient(90deg,var(--accent),transparent);opacity:.65}
    .card:active{transform:scale(.975);border-color:rgba(166,241,255,.34)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between}
    .module-icon{width:50px;height:50px;border-radius:16px;object-fit:cover;box-shadow:0 7px 22px rgba(0,0,0,.24)}
    .open{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:11px;
      background:rgba(166,241,255,.06);color:#76909c;font-size:17px}
    .name{margin-top:15px;font-size:16px;font-weight:700;letter-spacing:.015em}
    .desc{display:-webkit-box;min-height:36px;margin-top:5px;overflow:hidden;-webkit-box-orient:vertical;
      -webkit-line-clamp:2;color:#8195a1;font-size:11px;line-height:1.55}
    .card.health{--accent:#45d98a}.card.garden{--accent:#82cb58}.card.stock{--accent:#ff5858}
    .card.travel{--accent:#41a9ff}.card.ledger{--accent:#f0b85b}.card.archive{--accent:#9d82ff}
    .card.nexus{--accent:#5fd6e4}.card.notifications{--accent:#d88cff}
    .empty{grid-column:1/-1;padding:36px 18px;text-align:center;color:#718792;border:1px dashed #29404f;
      border-radius:18px;background:rgba(17,29,40,.45)}
    .hint{display:flex;gap:10px;margin:16px 2px 0;padding:13px 14px;border-radius:15px;
      background:rgba(17,29,40,.58);color:#738894;font-size:11px;line-height:1.5}
    .hint b{color:#9eb5bf;font-weight:650}
    @media(min-width:600px){main{padding:28px 24px 42px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="identity"><img src="brand/icon-master.png" alt=""><div><div class="eyebrow">Shadow mobile</div><div class="title">应用空间</div></div></div>
    <div class="status"><span class="dot"></span><span>已连接</span></div>
  </header>

  <section class="intro">
    <h1>选择要进入的空间</h1>
    <p>每个项目保持自己的能力和节奏，Shadow 只负责把它们放在同一个入口。</p>
  </section>

  <div class="section-head"><h2>全部应用</h2><span id="summary">正在载入</span></div>
  <section id="modules" class="grid" aria-live="polite"></section>
  <div class="hint"><span>⌂</span><span><b>日常从首页开始。</b> 首页进入 Nexus，底部“称重”可以随时开启三分钟体脂秤接收。</span></div>
</main>
<script>
  const iconNames=new Set(['app','archive','garden','health','ledger','platform','stock','travel','verse','wingman']);
  function iconName(value){return iconNames.has(value)?value:'app'}
  function moduleClass(value){return /^[a-z][a-z0-9-]{1,31}$/.test(value||'')?value:'app'}
  function escapeHtml(value){const node=document.createElement('span');node.textContent=value||'';return node.innerHTML}
  async function loadModules(){
    try{
      if(window.ShellBridge)return JSON.parse(ShellBridge.getModules());
      const response=await fetch('modules.json');return (await response.json()).modules||[];
    }catch(_){return[]}
  }
  function openModule(id){if(window.ShellBridge)ShellBridge.openModule(id)}
  async function render(){
    const modules=await loadModules();
    document.getElementById('summary').textContent=modules.length?`${modules.length} 个`:'暂无';
    const root=document.getElementById('modules');
    if(!modules.length){root.innerHTML='<div class="empty">暂时没有可用应用</div>';return}
    root.innerHTML=modules.map(m=>`<button class="card ${moduleClass(m.id)}" onclick="openModule('${m.id}')" aria-label="打开 ${escapeHtml(m.name)}">
      <div class="card-top"><img class="module-icon" src="icons/${iconName(m.icon)}.png" alt=""><span class="open">›</span></div>
      <div class="name">${escapeHtml(m.name)}</div><div class="desc">${escapeHtml(m.description)}</div></button>`).join('');
  }
  render();
</script>
</body>
</html>
